<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuerza Visual | Dirección de arte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="poster" aria-labelledby="poster-title">
        <div class="poster__grid" aria-hidden="true"></div>
        <div class="poster__dots" aria-hidden="true"></div>
        <header class="poster__header"><span class="star">✦</span><span>MANIFIESTO / 2025</span><span>EDICIÓN 01</span></header>
        <section class="poster__content">
            <p class="kicker">Ideas que dejan huella</p>
            <h1 id="poster-title">Hazlo<br><em>visible</em></h1>
            <p class="description">El diseño no pide permiso.<br>Abre espacio para lo imposible.</p>
        </section>
        <div class="poster__image" role="img" aria-label="Mano en blanco y negro alcanzando el centro del cartel"></div>
        <span class="poster__circle" aria-hidden="true"></span>
        <span class="poster__cross poster__cross--one" aria-hidden="true">+</span>
        <span class="poster__cross poster__cross--two" aria-hidden="true">+</span>
        <footer class="poster__footer"><span>CREATIVIDAD<br>EN MOVIMIENTO</span><span>NO HAY<br>FORMULAS</span><strong>01<br><small>POSTER</small></strong></footer>
    </main>
</body>

</html>
