<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validaciones</title>
</head>

<body>

    <form action="#" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" name="nombre">
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="ejemplo37@gmail.com">
        </div>

        <div>
            <label for="telefono">Telefono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="3274456860" title="Ingresa 10 digitos por favor" pattern="[0-10]">
        </div>

        <div>
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" max="100" step="5" value="10">
        </div>


        <div>
            <label for="mensaj"></label>
            <textarea name="mensaje" id="mensaj" cols="30" rows="10"></textarea>
        </div>
        <div>
            <label for="fecha"></label>
            <input type="date" name="fecha" id="fecha" min="2024-01-01" max="2026-12-31">
        </div>

        <div>
            <label for="password">Contraseña (minimo 10 caracteres):</label>
            <input type="password" id="password" name="password" required placeholder="Minimo de 10 Caracteres" minlength="8">
        </div>


        <button type="submit">Enviar</button>

    </form>
</body>

</html>
