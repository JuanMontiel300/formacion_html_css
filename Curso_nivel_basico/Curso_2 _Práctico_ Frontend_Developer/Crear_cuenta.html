<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
         :root {
            --white: #FFFFFF;
            --black: #000000;
            --very-light-pink: #C7C7C7;
            --text-input-field: #F7F7F7;
            --hospital-green: #ACD9B2;
            --sm: 14px;
            --md: 16px;
            --lg: 18px;
        }
        
        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        
        .login {
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        
        .form-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 300px;
        }
        
        .email-img {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background-color: var(--text-input-field);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .Titulo {
            font-size: var(--lg);
            margin-bottom: 30px;
        }
        
        .formulario {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            height: 100%;
        }
        
        .formulario div {
            display: flex;
            flex-direction: column;
        }
        
        .label {
            font-size: var(--sm);
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .input {
            background: var(--text-input-field);
            border: none;
            border-radius: 8px;
            height: 29px;
            font-size: var(--md);
            padding: 6px;
            margin-bottom: 12px;
        }
        
        .input-gmail,
        .input-password {
            margin-bottom: 22px;
        }
        
        .primary-button {
            background: var(--hospital-green);
            border-radius: 8px;
            border: none;
            color: var(--white);
            width: 100%;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
            margin-top: 15px;
            margin-bottom: 28px;
        }
        
        @media(max-width: 540px) {
            .logo {
                display: block;
            }
            .form-container {
                height: 100%;
            }
            .formulario {
                height: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <div class="login">
        <div class="form-container">
            <h1 class="Titulo">My account</h1>
            <form action="/" class="formulario">
                <div>
                    <label for="name" class="label">Name</label>
                    <input type="Text" id="name" name="name" placeholder="Juan Montiel" class="input">
                    <label for="gmail" class="label">Email</label>
                    <input type="Text" id="gmail" name="gmail" placeholder="jhon4949@gmai.com" class="input input-gmail">
                    <label for="password" class="label">Password</label>
                    <input type="password" id="password" placeholder="*****" class="input input-password">
                </div>

                <button class="primary-button">Create</button>

            </form>
        </div>

    </div>
</body>
