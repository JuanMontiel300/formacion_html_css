<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
         :root {
            --white: #FFFFFF;
            --black: #000000;
            --very-light-pink: #C7C7C7;
            --text-input-field: #F7F7F7;
            --hospital-green: #ACD9B2;
            --sm: 14px;
            --md: 16px;
            --lg: 18px;
        }
        
        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        
        .product {
            width: 360px;
            position: absolute;
            right: 0;
            top: 0;
            background: #f3f3f3;
        }
        
        .product-icon {
            background: rgba(255, 255, 255, 0.9);
            width: 36px;
            height: 36px;
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 2;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        
        .product-icon:hover {
            cursor: pointer;
        }
        
        .product-icon img {
            width: 16px;
            height: 16px;
            display: block;
        }
        
        .product- {
            margin: 0;
        }
        
        .product>img:nth-child(2) {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 0 0 20px 20px;
            display: block;
        }
        
        .product-info p {
            margin: 0 24px;
        }
        
        .product-info p:nth-child(2) {
            font-weight: bold;
            font-size: var(--md);
            margin-top: 24px;
            margin-bottom: 4px;
        }
        
        .product-info p:nth-child(3) {
            color: var(--very-light-pink);
            font-size: var(--md);
            margin-bottom: 28px;
        }
        
        .product-info p:nth-child(4) {
            color: var(--very-light-pink);
            font-size: var(--sm);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        
        .primary-button {
            background: var(--hospital-green);
            border-radius: 8px;
            border: none;
            color: var(--white);
            width: calc(100% - 48px);
            margin: 0 24px;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .primary-button img {
            width: 20px;
            height: 20px;
        }
        
        @media(max-width: 640px) {
            .product {
                width: 100%;
            }
        }
    </style>
</head>

<body>


    <aside class="product">
        <div class="product-icon">
            <img src="./icons/icon_close.png">
        </div>
        <img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940">
        <div class="product-info">

            <p>$30,00</p>
            <p>Bicicle super rapida</p>
            <p>Es una bicicleta super rapida cruza montes y montañas es terreneitor la bicicleta mas rapida del mundo</p>
            <button class="primary-button cart-button">
                    <img src="./icons/bt_add_to_cart.svg">
                    Add to cart
                </button>
        </div>
    </aside>

</body>

</html>
