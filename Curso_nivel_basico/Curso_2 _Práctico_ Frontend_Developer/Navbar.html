<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
         :root {
            --white: #FFFFFF;
            --black: #000000;
            --very-light-pink: #C7C7C7;
            --text-input-field: #F7F7F7;
            --hospital-green: #ACD9B2;
            --sm: 14px;
            --md: 16px;
            --lg: 18px;
        }
        
        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        
        * {
            box-sizing: border-box;
        }
        
        .menu {
            display: none;
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        
        .logo-left {
            width: 100px;
            height: auto;
            display: block;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--very-light-pink);
            width: 100%;
            height: 60px;
            padding: 0 24px;
        }
        
        .navbar-left,
        .navbar-right {
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        .navbar-left ul,
        .navbar-right ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        .navbar-left {
            gap: 12px;
        }
        
        .navbar-left ul {
            margin-left: 12px;
            gap: 12px;
        }
        
        .navbar-left ul li,
        .navbar-right ul li {
            display: flex;
            align-items: center;
        }
        
        .navbar-left ul li a,
        .navbar-right ul li a {
            text-decoration: none;
            color: var(--very-light-pink);
            border: 1px solid transparent;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .navbar-left ul li a:hover,
        .navbar-right ul li a:hover {
            border-color: var(--hospital-green);
            color: var(--hospital-green);
        }
        
        .navbar-email {
            color: var(--very-light-pink);
            font-size: var(--sm);
            margin-right: 18px;
            font-weight: 500;
        }
        
        .navbar-cart {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }
        
        .navbar-cart img {
            display: block;
            width: 24px;
            height: 24px;
        }
        
        .navbar-cart div {
            width: 16px;
            height: 16px;
            background: var(--hospital-green);
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            position: absolute;
            top: -6px;
            right: -5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--black);
        }
        
        @media (max-width: 640px) {
            nav {
                padding: 0 16px;
            }
            .menu {
                display: block;
            }
            .navbar-left ul {
                display: none;
            }
            .navbar-email {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav>
        <img src="./icons/icon_menu.svg" alt="menu" class="menu">

        <div class="navbar-left">
            <img src="./logos/logo_yard_sale.svg" alt="logo" class="logo-left">


            <ul>
                <li>
                    <a href="">All</a>
                </li>
                <li>
                    <a href="">Clothes</a>
                </li>
                <li>
                    <a href="">Electronics</a>
                </li>
                <li>
                    <a href="">Furnitures</a>
                </li>
                <li>
                    <a href="">Toys</a>
                </li>
                <li>
                    <a href="">Other</a>
                </li>

            </ul>
        </div>
        <div class="navbar-right">
            <ul>
                <li class="navbar-email">pepito39@example.com</li>
                <li class="navbar-cart">
                    <img src="./icons/icon_shopping_cart.svg">
                    <div>2</div>

                </li>
            </ul>
        </div>
    </nav>


</body>

</html>
