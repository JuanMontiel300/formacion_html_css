<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
         :root {
            --white: #FFFFFF;
            --black: #000000;
            --very-light-pink: #C7C7C7;
            --text-input-field: #F7F7F7;
            --hospital-green: #ACD9B2;
            --sm: 14px;
            --md: 16px;
            --lg: 18px;
        }
        
        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        
        .Title {
            font-size: var(--lg);
            font-weight: bold;
        }
        
        .title-container {
            display: flex;
        }
        
        .title-container img {
            transform: rotate(180deg);
            margin-right: 14px;
        }
        
        .product {
            width: 360px;
            padding: 24px;
            position: absolute;
            right: 0;
            box-sizing: border-box;
        }
        
        .order {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            background-color: var(--text-input-field);
            border-radius: 9px;
            margin-bottom: 20px;
            padding: 0 24px;
        }
        
        .order-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 300px;
        }
        
        .order-content {
            display: flex;
            flex-direction: column;
        }
        
        .cart figure img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
        }
        
        .cart {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 16px;
            margin-bottom: 24px;
            align-items: center;
        }
        
        .cart figure {
            margin: 0;
        }
        
        .cart p:nth-child(2) {
            color: var(--very-light-pink);
        }
        
        .cart p:nth-child(3) {
            font-size: var(--md);
            font-weight: bold;
        }
        
        .order p:nth-child(1) {
            display: flex;
            flex-direction: column;
            text-align: end;
        }
        
        .order p span:nth-child(1),
        .order p:nth-child(2) {
            font-size: var(--md);
            font-weight: bold;
        }
        
        .order p:nth-child(2) {
            text-align: end;
        }
        
        .primary-button {
            background: var(--hospital-green);
            border-radius: 8px;
            border: none;
            color: var(--white);
            width: calc(100% - 48px);
            margin: 0 24px;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        @media(max-width: 640px) {
            .product {
                width: 100%;
            }
        }
    </style>
</head>

<body>


    <aside class="product">
        <div class="title-container">
            <img src="./icons/flechita.svg">
            <p class="Title">My order</p>

        </div>


        <div class="order-content">

            <div class="cart">
                <figure><img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"></figure>
                <p>Bike</p>
                <p>$100.000</p>
                <img src="./icons/icon_close.png">
            </div>
            <div class="cart">
                <figure><img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"></figure>
                <p>Bike</p>
                <p>$120.000</p>
                <img src="./icons/icon_close.png">
            </div>
            <div class="cart">
                <figure><img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"></figure>
                <p>Bike</p>
                <p>$100.000</p>
                <img src="./icons/icon_close.png">
            </div>
            <div class="cart">
                <figure><img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"></figure>
                <p>Bike</p>
                <p>$100.000</p>
                <img src="./icons/icon_close.png">
            </div>
            <div class="cart">
                <figure><img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"></figure>
                <p>Bike</p>
                <p>$100.000</p>
                <img src="./icons/icon_close.png">
            </div>
            <div class="cart">
                <figure><img src="https://images.pexels.com/photos/35057478/pexels-photo-35057478.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"></figure>
                <p>Bike</p>
                <p>$100.000</p>
                <img src="./icons/icon_close.png">
            </div>
            <div class="order">
                <p>
                    <span>Total</span>

                </p>
                <p>$600.000</p>
            </div>
            <button class="primary-button ">
                Checkout
            </button>

        </div>
    </aside>

</body>

</html>
