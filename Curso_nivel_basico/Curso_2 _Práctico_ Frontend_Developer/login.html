<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
         :root {
            --white: #FFFFFF;
            --black: #000000;
            --very-light-pink: #C7C7C7;
            --text-input-field: #F7F7F7;
            --hospital-green: #ACD9B2;
            --sm: 14px;
            --md: 16px;
            --lg: 18px;
        }
        
        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        
        .login {
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        
        .form-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 300px;
        }
        
        .logo {
            width: 150px;
            margin-bottom: 48px;
            justify-self: center;
            display: none;
        }
        
        .email-img {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background-color: var(--text-input-field);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .formulario {
            display: grid;
            grid-template-rows: auto 1fr auto;
            margin-bottom: 20px;
        }
        
        .label {
            font-size: var(--sm);
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .input {
            background: var(--text-input-field);
            border: none;
            border-radius: 8px;
            height: 30px;
            font-size: var(--md);
            padding: 6px;
            margin-bottom: 17px;
        }
        
        .primary-button {
            background: var(--hospital-green);
            border-radius: 8px;
            border: none;
            color: var(--white);
            width: 100%;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
            margin-top: 12px;
            margin-bottom: 28px;
        }
        
        form a {
            color: var(--hospital-green);
            font-size: var(--sm);
            text-align: center;
            margin-bottom: 35px;
            text-decoration: none;
        }
        
        .login-button {
            background: var(--white);
            color: var(--hospital-green);
            width: 100%;
            font-size: var(--md);
            height: 50px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid var(--hospital-green);
        }
        
        @media(max-width: 540px) {
            .logo {
                display: block;
            }
            form a {
                margin-bottom: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="login">
        <div class="form-container">
            <img src="./logos/logo_yard_sale.svg" alt="logo" class="logo">
            <form action="/" class="formulario">
                <label for="gmail" class="label">Email adress</label>
                <input type="Text" id="gmail" name="gmail" placeholder="jhon4949@gmai.com" class="input">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" placeholder="*******" class="input input-password">
                <button class="primary-button">Login</button>
                <a href="">Forgot my password</a>

            </form>


            <button class="login-button">Sign up</button>

        </div>

    </div>
</body>

</html>
