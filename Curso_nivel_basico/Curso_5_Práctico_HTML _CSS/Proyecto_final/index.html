<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <nav class="container-nav">

            <ul class="nav-right">
                <li><a href="#">Gmail</a></li>
                <li><a href="#">Imágenes</a></li>
                <li>
                    <button type="button" aria-label="Aplicaciones de Google">
                        <img src="icono/icono_app.png" alt="">
                    </button>
                </li>
                <li><img class="img-foto" src="img/imagen.jpeg" alt="Foto de perfil"></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="buscador">
            <img src="img/logo.webp" alt="Google">

            <form action="#">
                <input type="search" id="busqueda" name="busqueda">
                <div>
                    <button type="submit">Buscar con Google</button>
                    <button type="button">Voy a tener suerte</button>
                </div>
            </form>

            <p>
                Google disponible en:
                <a href="#">Español (Latinoamérica)</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Colombia</p>

        <div class="container-footer">
            <ul class="footer-left">
                <li><a href="#">Sobre Google</a></li>
                <li><a href="#">Publicidad</a></li>
                <li><a href="#">Negocios</a></li>
                <li><a href="#">Cómo funciona la Búsqueda</a></li>
            </ul>

            <ul class="footer-right">
                <li><a href="#">Privacidad</a></li>
                <li><a href="#">Condiciones</a></li>
                <li><a href="#">Configuración</a></li>
            </ul>
        </div>
    </footer>

</body>

</html>
