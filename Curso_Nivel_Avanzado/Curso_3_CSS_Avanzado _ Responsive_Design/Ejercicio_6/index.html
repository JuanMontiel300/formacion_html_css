<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container queries vs media queries en CSS</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <h1>Media Queries vs Container Queries</h1>

    <h3>Media Queries (dependerá del viewport)</h3>
    <div class="tarjeta">
        Esta tarjeta cambiará de color si el **viewport** es menor a 600px de ancho
    </div>

    <h3>Container Queries (dependerá del contenedor)</h3>
    <div class="contenedor">
        <div class="tarjeta">
            Esta tarjeta cambiará de color si el **contenedor** es menor a 400px de ancho
        </div>
    </div>

</body>

</html>
