<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;
        }
        
        .phone {
            width: 300px;
            height: 600px;
            background: #ccefff;
            box-shadow: 0 19px 30px rgb(0, 0, 0, 0.30), 0 15px 12px rgb(0, 0, 0, 0.20);
            position: relative;
            border-radius: 40px;
            border: 8px solid black;
            overflow: hidden;
        }
        
        .layer-1 {
            position: absolute;
            z-index: 1;
            height: 450px;
            width: 80px;
            bottom: 0;
            right: 60px;
        }
        
        .left-ear-outer {
            position: absolute;
            left: 10px;
            background: rgb(252, 252, 252);
            width: 20px;
            height: 50px;
            border-radius: 90%;
        }
        
        .left-ear--inner {
            position: absolute;
            left: 10px;
            background: pink;
            width: 10px;
            height: 40px;
            border-radius: 90%;
            left: 15px;
            top: 8px;
        }
        
        .right-ear-outer {
            position: absolute;
            right: 10px;
            top: 1px;
            background: rgb(255, 255, 255);
            width: 20px;
            height: 50px;
            border-radius: 90%;
        }
        
        .right-ear--inner {
            position: absolute;
            background: pink;
            width: 10px;
            height: 40px;
            border-radius: 90%;
            right: 15px;
            top: 8px;
        }
        
        .head {
            position: absolute;
            background: white;
            border-radius: 50%;
            top: 30px;
            left: 5px;
            bottom: 0;
            width: 70px;
            height: 50px;
        }
        
        .head__eye {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 100%;
            background: black;
        }
        
        .head__eye--left {
            top: 13px;
            left: 40px;
        }
        
        .head__eye--right {
            left: 25px;
            top: 13px;
        }
        
        .layer-2 {
            height: 450px;
            width: 80px;
            position: absolute;
            z-index: 2;
            bottom: 0;
            left: 60px;
        }
        
        .layer-3 {
            position: absolute;
            width: 220px;
            height: 400px;
            bottom: 0;
            left: 0;
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.30), 0 15px 12px rgba(0, 0, 0, 0.22);
            right: 0;
            margin: 0 auto;
            background: #bf624c;
            border-radius: 10px 10px 0 0;
            z-index: 3;
        }
        
        .pasto {
            width: 100%;
            height: 15px;
            border-radius: 10px 10px 0 0;
            background: green;
        }
        
        .pasto-1 {
            background: linear-gradient(135deg, green 25%, transparent 25%) -50px 0, linear-gradient(-135deg, green 25%, transparent 25%) -50px 0, linear-gradient(45deg, #57381a 25%, transparent 25%), linear-gradient(-45deg, transparent 25%, #57381a 25%);
            background-size: 33px 30px;
            width: 100%;
            height: 15px;
        }
        
        .layer-4 {
            position: absolute;
            z-index: 4;
            left: 20px;
            bottom: 0px;
            height: 350px;
            width: 80px;
        }
        
        .layer-5 {
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.30), 0 15px 12px rgba(0, 0, 0, 0.22);
            border-radius: 10px 10px 0 0;
            background: #bf624c;
            position: absolute;
            z-index: 5;
            width: 200px;
            top: 50%;
            bottom: 0;
            border-radius: 10px;
            height: 300px;
        }
        
        .layer-6 {
            right: 0;
            left: 190px;
            bottom: 0px;
            height: 250px;
            width: 80px;
            position: absolute;
            z-index: 6;
        }
        
        .layer-7 {
            width: 150px;
            height: 200px;
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.30), 0 15px 12px rgba(0, 0, 0, 0.22);
            right: 0;
            bottom: 0;
            background: #bf624c;
            border-radius: 10px;
            position: absolute;
            z-index: 7;
        }
        
        .layer-8 {
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            height: 100px;
            width: 190px;
            position: absolute;
            z-index: 8;
        }
        
        .layer-8__left {
            width: 70px;
            position: absolute;
            bottom: 0;
            background: green;
            border-radius: 50px 50px 0 0;
            height: 80px;
        }
        
        .layer-8__center {
            position: absolute;
            top: 0px;
            left: 50px;
            width: 80px;
            background: green;
            border-radius: 50px 50px 0 0;
            height: 100px;
        }
        
        .layer-8__right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 80px;
            background: green;
            border-radius: 50px 50px 0 0;
            height: 80px;
        }
        
        .layer-9 {
            width: 130px;
            height: 100px;
            bottom: 0;
            left: 0;
            position: absolute;
            z-index: 9;
        }
        
        .layer-9__left {
            width: 80px;
            border-radius: 50px 50px 0 20px;
            height: 100px;
            background: white;
        }
        
        .layer-9__right {
            position: absolute;
            height: 60px;
            width: 80px;
            border-radius: 50px 50px 0 0;
            right: 0;
            bottom: 0;
            background: white;
        }
        
        .layer-10 {
            width: 130px;
            height: 100px;
            bottom: 0;
            right: 0;
            position: absolute;
            z-index: 10;
        }
        
        .layer-10__left {
            position: absolute;
            right: 0;
            width: 80px;
            height: 100px;
            background: white;
            border-radius: 50px 50px 20px 0;
        }
        
        .layer-10__right {
            position: absolute;
            right: 40px;
            bottom: 0;
            width: 80px;
            height: 60px;
            background: white;
            border-radius: 50px 50px 0 0;
        }
    </style>
</head>

<body>
    <div class="phone">
        <div class="layer-1">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-2">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-3">
            <div class="pasto"></div>
            <div class="pasto-1"></div>
        </div>
        <div class="layer-4">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-5">
            <div class="pasto"></div>
            <div class="pasto-1"></div>
        </div>
        <div class="layer-6">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-7">
            <div class="pasto"></div>
            <div class="pasto-1"></div>
        </div>
        <div class="layer-8">
            <div class="layer-8__left"></div>
            <div class="layer-8__center"></div>
            <div class="layer-8__right"></div>
        </div>
        <div class="layer-9">
            <div class="layer-9__left"></div>
            <div class="layer-9__right"></div>
        </div>
        <div class="layer-10">
            <div class="layer-10__left"></div>
            <div class="layer-10__right"></div>
        </div>
    </div>
</body>

</html>
