<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;
        }
        
        .phone {
            width: 300px;
            height: 600px;
            background: #ccefff;
            box-shadow: 0 19px 30px rgb(0, 0, 0, 0.30), 0 15px 12px rgb(0, 0, 0, 0.20);
            position: relative;
            border-radius: 40px;
            border: 8px solid black;
            overflow: hidden;
            counter-reset: score;
        }
        
        .Titulo {
            margin-top: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .Titulo img {
            display: block;
            width: 150px;
        }
        
        .Titulo h3 {
            margin: 4px 0 0;
            font-size: 16px;
        }
        
        .layer-1 {
            position: absolute;
            z-index: 1;
            height: 450px;
            width: 80px;
            bottom: 0;
            right: 60px;
            animation-name: layer-1;
            animation-duration: 1s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }
        
        @keyframes layer-1 {
            0% {
                bottom: 0;
            }
            25% {
                bottom: -80px;
            }
            100% {
                bottom: 0;
            }
        }
        
        input[type=checkbox] {
            position: absolute;
            appearance: none;
            cursor: pointer;
            height: 100%;
            left: 0;
            margin: 0;
            top: 0;
            width: 100%;
            z-index: 2;
            opacity: 0;
        }
        
        input[type=checkbox] {
            appearance: none;
            outline: none;
        }
        
        .left-ear-outer {
            position: absolute;
            left: 10px;
            background: rgb(252, 252, 252);
            width: 20px;
            height: 50px;
            border-radius: 90%;
        }
        
        .left-ear--inner {
            position: absolute;
            left: 10px;
            background: pink;
            width: 10px;
            height: 40px;
            border-radius: 90%;
            left: 15px;
            top: 8px;
        }
        
        .right-ear-outer {
            position: absolute;
            right: 10px;
            top: 1px;
            background: rgb(255, 255, 255);
            width: 20px;
            height: 50px;
            border-radius: 90%;
        }
        
        .right-ear--inner {
            position: absolute;
            background: pink;
            width: 10px;
            height: 40px;
            border-radius: 90%;
            right: 15px;
            top: 8px;
        }
        
        .head {
            position: absolute;
            background: white;
            border-radius: 50%;
            top: 30px;
            left: 5px;
            bottom: 0;
            width: 70px;
            height: 50px;
        }
        
        .head__eye {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 100%;
            background: black;
            animation-name: blink;
            animation-duration: 1.6s;
            animation-iteration-count: infinite;
        }
        
        @keyframes blink {
            0% {
                height: 5px;
            }
            5% {
                transform: translateY(2px);
                height: 0;
            }
            10% {
                height: 5px;
                transform: translate(0px, 0px);
            }
        }
        
        .head__eye--left {
            top: 13px;
            left: 40px;
        }
        
        .head__eye--right {
            left: 25px;
            top: 13px;
        }
        
        .layer-2 {
            height: 450px;
            width: 80px;
            position: absolute;
            z-index: 2;
            bottom: 0;
            left: 60px;
            animation-name: layer-2;
            animation-duration: 2s;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
        }
        
        @keyframes layer-2 {
            0% {
                bottom: 0;
            }
            15% {
                bottom: -80px;
            }
            80% {
                bottom: 0;
            }
        }
        
        .layer-3 {
            position: absolute;
            width: 220px;
            height: 400px;
            bottom: 0;
            left: 0;
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.30), 0 15px 12px rgba(0, 0, 0, 0.22);
            right: 0;
            margin: 0 auto;
            background: #bf624c;
            border-radius: 10px 10px 0 0;
            z-index: 3;
        }
        
        .pasto {
            width: 100%;
            height: 15px;
            border-radius: 10px 10px 0 0;
            background: green;
        }
        
        .pasto-1 {
            background: linear-gradient(135deg, green 25%, transparent 25%) -50px 0, linear-gradient(-135deg, green 25%, transparent 25%) -50px 0, linear-gradient(45deg, #57381a 25%, transparent 25%), linear-gradient(-45deg, transparent 25%, #57381a 25%);
            background-size: 33px 30px;
            width: 100%;
            height: 15px;
        }
        
        .layer-4 {
            position: absolute;
            z-index: 4;
            left: 20px;
            bottom: 0px;
            height: 350px;
            width: 80px;
            animation-name: layer-3;
            animation-duration: 0.5s;
            animation-timing-function: ease;
            animation-iteration-count: infinite;
        }
        
        @keyframes layer-3 {
            0% {
                bottom: 0;
            }
            15% {
                bottom: -80px;
            }
            100% {
                bottom: 0;
            }
        }
        
        .layer-5 {
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.30), 0 15px 12px rgba(0, 0, 0, 0.22);
            border-radius: 10px 10px 0 0;
            background: #bf624c;
            position: absolute;
            z-index: 5;
            width: 200px;
            top: 50%;
            bottom: 0;
            border-radius: 10px;
            height: 300px;
        }
        
        .layer-6 {
            right: 0;
            left: 190px;
            bottom: 0px;
            height: 250px;
            width: 80px;
            position: absolute;
            z-index: 6;
            animation-name: layer-4;
            animation-duration: 1.5s;
            animation-timing-function: ease;
            animation-iteration-count: infinite;
        }
        
        @keyframes layer-4 {
            0% {
                bottom: 0;
            }
            15% {
                bottom: -80px;
            }
            100% {
                bottom: 0;
            }
        }
        
        .layer-7 {
            width: 150px;
            height: 200px;
            box-shadow: 0 19px 38px rgba(0, 0, 0, 0.30), 0 15px 12px rgba(0, 0, 0, 0.22);
            right: 0;
            bottom: 0;
            background: #bf624c;
            border-radius: 10px;
            position: absolute;
            z-index: 7;
        }
        
        .layer-8 {
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            height: 100px;
            width: 190px;
            position: absolute;
            z-index: 8;
        }
        
        .layer-8__left {
            width: 70px;
            position: absolute;
            bottom: 0;
            background: green;
            border-radius: 50px 50px 0 0;
            height: 80px;
        }
        
        .layer-8__center {
            position: absolute;
            top: 0px;
            left: 50px;
            width: 80px;
            background: green;
            border-radius: 50px 50px 0 0;
            height: 100px;
        }
        
        .layer-8__right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 80px;
            background: green;
            border-radius: 50px 50px 0 0;
            height: 80px;
        }
        
        .layer-9 {
            width: 130px;
            height: 100px;
            bottom: 0;
            left: 0;
            position: absolute;
            z-index: 9;
        }
        
        .layer-9__left {
            width: 80px;
            border-radius: 50px 50px 0 20px;
            height: 100px;
            background: white;
        }
        
        .layer-9__right {
            position: absolute;
            height: 60px;
            width: 80px;
            border-radius: 50px 50px 0 0;
            right: 0;
            bottom: 0;
            background: white;
        }
        
        .layer-10 {
            width: 130px;
            height: 100px;
            bottom: 0;
            right: 0;
            position: absolute;
            z-index: 10;
        }
        
        .layer-10__left {
            position: absolute;
            right: 0;
            width: 80px;
            height: 100px;
            background: white;
            border-radius: 50px 50px 20px 0;
        }
        
        .layer-10__right {
            position: absolute;
            right: 40px;
            bottom: 0;
            width: 80px;
            height: 60px;
            background: white;
            border-radius: 50px 50px 0 0;
        }
    </style>
</head>

<body>
    <div class="phone">
        <div class="Titulo">
            <img src="https://i.ibb.co/J3Kn71r/cbd152ddb203fe23ad78261749534e7d.png" alt="Animationland">
            <h3 class="total-count">Score: <span>0</span></h3>
        </div>
        <div class="layer-1">
            <input type="checkbox">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-2">
            <input type="checkbox">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-3">
            <div class="pasto"></div>
            <div class="pasto-1"></div>
        </div>
        <div class="layer-4">
            <input type="checkbox">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-5">
            <div class="pasto"></div>
            <div class="pasto-1"></div>
        </div>
        <div class="layer-6">
            <input type="checkbox">
            <div class="left-ear-outer"></div>
            <div class="left-ear--inner"></div>
            <div class="right-ear-outer"></div>
            <div class="right-ear--inner"></div>
            <div class="head">
                <div class="head__eye head__eye--left"></div>
                <div class="head__eye head__eye--right"></div>
            </div>
        </div>
        <div class="layer-7">
            <div class="pasto"></div>
            <div class="pasto-1"></div>
        </div>
        <div class="layer-8">
            <div class="layer-8__left"></div>
            <div class="layer-8__center"></div>
            <div class="layer-8__right"></div>
        </div>
        <div class="layer-9">
            <div class="layer-9__left"></div>
            <div class="layer-9__right"></div>
        </div>
        <div class="layer-10">
            <div class="layer-10__left"></div>
            <div class="layer-10__right"></div>
        </div>
    </div>
    <script>
        const rabbitInputs = document.querySelectorAll('.layer-1 input, .layer-2 input, .layer-4 input, .layer-6 input');
        const score = document.querySelector('.total-count span');

        rabbitInputs.forEach((rabbitInput) => {
            rabbitInput.addEventListener('change', () => {
                const checkedRabbits = [...rabbitInputs].filter((input) => input.checked).length;
                score.textContent = checkedRabbits;
            });
        });
    </script>
</body>

</html>
