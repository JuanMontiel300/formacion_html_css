<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            width: 100%;
            display: grid;
            counter-reset: score;
            place-items: center;
        }
        
        .phone {
            width: 300px;
            height: 600px;
            background: #ccefff;
            box-shadow: 0 19px 30px rgb(0, 0, 0, 0.30), 0 15px 12px rgb(0, 0, 0, 0.20);
            position: relative;
            border-radius: 40px;
            border: 8px solid black;
        }
        
        .layer-1 {
            position: absolute;
            z-index: 1;
            height: 450px;
            width: 80px;
            background: white;
            bottom: 0;
            right: 60px;
        }
        
        .layer-2 {
            height: 450px;
            width: 80px;
            background: white;
            position: absolute;
            z-index: 2;
            bottom: 0;
            left: 60px;
        }
        
        .layer-3 {
            position: absolute;
            width: 220px;
            height: 400px;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            background: rgb(237, 88, 88);
            z-index: 3;
        }
        
        .layer-4 {
            position: absolute;
            z-index: 4;
            left: 20px;
            bottom: 0px;
            height: 350px;
            width: 80px;
            background: white;
        }
        
        .layer-5 {
            background: rgb(235, 112, 112);
            position: absolute;
            z-index: 5;
            width: 200px;
            top: 50%;
            bottom: 0;
            border-radius: 0 0 0 30px;
            height: 300px;
        }
        
        .layer-6 {
            right: 0;
            left: 190px;
            bottom: 0px;
            height: 250px;
            width: 80px;
            background: white;
            position: absolute;
            z-index: 6;
        }
        
        .layer-7 {
            width: 150px;
            height: 200px;
            right: 0;
            bottom: 0;
            background: rgb(237, 88, 88);
            border-radius: 0 0 20px 0;
            position: absolute;
            z-index: 7;
        }
        
        .layer-8 {
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            height: 90px;
            width: 190px;
            background: white;
            position: absolute;
            z-index: 8;
        }
        
        .layer-9 {
            width: 80px;
            height: 80px;
            bottom: 0;
            left: 0;
            background: rgb(22, 221, 29);
            position: absolute;
            z-index: 9;
        }
        
        .layer-10 {
            width: 80px;
            height: 80px;
            bottom: 0;
            right: 0;
            background: rgb(22, 221, 29);
            position: absolute;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="phone">
        <div class="layer-1"></div>
        <div class="layer-2"></div>
        <div class="layer-3"></div>
        <div class="layer-4"></div>
        <div class="layer-5"></div>
        <div class="layer-6"></div>
        <div class="layer-7"></div>
        <div class="layer-8"></div>
        <div class="layer-9"></div>
        <div class="layer-10"></div>
    </div>
</body>

</html>
