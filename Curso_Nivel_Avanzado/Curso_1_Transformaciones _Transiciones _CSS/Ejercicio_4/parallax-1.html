<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
        }
        
        .parallax-container {
            width: 100%;
            height: 100vh;
            perspective: 5px;
            perspective-origin: 50%;
            overflow-x: hidden;
            overflow-y: scroll;
            position: relative;
        }
        
        .image {
            position: absolute;
            left: 0;
            right: 0;
            margin: 0 auto;
            transform: 0 50%;
        }
        
        .image__background {
            height: auto;
            width: 100%;
            transform: translateZ(0px) scale(1);
            transform-origin: 0 50%;
        }
        
        .image__middle {
            height: 100%;
            width: 100%;
            transform: translateZ(1px) scale(0.8);
            transform-origin: 50%;
        }
        
        .card {
            background: rgb(255, 255, 255);
            width: 80px;
            height: 100px;
            position: absolute;
            border-radius: 8px;
            transform: rotate(10deg);
        }
        
        .one {
            left: 20%;
        }
        
        .two {
            right: 80%;
            top: 70%;
        }
        
        .three {
            right: 10%;
            bottom: 700px;
        }
        
        .image__foregound {
            transform: translateZ(2px) scale(0.75);
            transform-origin: top;
            ;
        }
    </style>
</head>

<body>
    <div class="parallax-container">
        <div class="image image__background">
            <img src="./img/Background.png" alt="fondo">
        </div>

        <div class="image image__middle">
            <div class="card one"></div>
            <div class="card two"></div>
            <div class="card three"></div>
        </div>

        <div class="image image__foregound">
            <img src="./img/Alice.png" alt="Alice">
        </div>
    </div>
</body>

</html>
