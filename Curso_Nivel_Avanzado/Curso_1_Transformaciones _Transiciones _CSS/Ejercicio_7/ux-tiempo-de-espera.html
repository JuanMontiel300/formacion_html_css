<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
        }
        
        ul {
            list-style: none;
        }
        
        a {
            text-decoration: none;
        }
        
        .nav {
            margin: 0;
            display: flex;
            width: 100%;
            height: 40px;
            align-items: center;
            background: blue;
        }
        
        .nav li {
            margin-right: 10px;
        }
        
        .nav li ul {
            margin: 20px;
            display: block;
            opacity: 0;
            position: absolute;
            transition: opacity 400ms;
            transition-delay: 300ms;
        }
        
        .nav li:hover>ul {
            transition: opacity 400ms;
            transition-delay: 300ms;
            opacity: 1;
        }
        
        .nav li ul li {
            width: 100px;
            background: rgb(64, 64, 247);
            position: relative;
        }
        
        .nav li ul li a {
            color: white;
        }
        
        .nav li ul li {
            right: -90px;
        }
    </style>
</head>

<body>
    <ul class="nav">
        <li>
            <a href="">Mujer</a>
            <ul>
                <li>
                    <a href="">Camisetas</a>

                </li>
                <li>
                    <a href="">Pantalones</a>

                </li>
                <li>
                    <a href="">Shorts</a>
                    <ul>
                        <li>
                            <a href="">Cortos</a>
                            <a href="">Largos</a>
                            <a href="">traparente</a>
                        </li>
                    </ul>

                </li>
            </ul>
        </li>
        <li>
            <a href="">Hombre</a>
        </li>
        <li>
            <a href="">Ninos</a>
        </li>
    </ul>
</body>

</html>
